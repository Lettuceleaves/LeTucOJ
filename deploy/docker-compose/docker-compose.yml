services:

  # --- 基础中间件服务 ---

  registry:
    image: registry:2
    container_name: docker-registry
    ports:
      - "5000:5000"
    restart: always
    volumes:
      - ./registry_data:/var/lib/registry
    mem_limit: 512m
    mem_reservation: 256m

  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - ../mysql/letucoj.sql:/docker-entrypoint-initdb.d/letucoj.sql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: letucoj
    mem_limit: 2g
    mem_reservation: 1g

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 256m
    mem_reservation: 128m

  namesrv:
    image: apache/rocketmq:5.3.3
    container_name: rocketmq-namesrv
    ports:
      - "9876:9876"
    mem_limit: 512m
    mem_reservation: 256m
    command: sh mqnamesrv
    restart: always

  broker:
    image: apache/rocketmq:5.3.3
    container_name: rocketmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./broker.conf:/home/rocketmq/rocketmq-5.3.3/conf/broker.conf
    environment:
      - NAMESRV_ADDR=namesrv:9876
      - JAVA_OPT=-Xms512m -Xmx512m
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.3/conf/broker.conf
    restart: always
    depends_on:
      - namesrv

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9005:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ROOTUSER
      MINIO_ROOT_PASSWORD: LETUC0J123
    volumes:
      - ../minio/data:/data
    command: server /data --console-address ":9001"
    mem_limit: 1g
    mem_reservation: 512m

  # --- 业务微服务 (从本地 Registry 拉取) ---

  sys:
    image: localhost:5000/sys:latest  # <--- 已修正
    container_name: sys
    ports:
      - "2121:2121"
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - MYSQL_HOST=mysql
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"
    depends_on:
      - mysql
      - minio
      - registry

  user:
    image: localhost:5000/user:latest # <--- 已修正
    container_name: user
    ports:
      - "5555:5555"
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      - mysql
      - redis
      - namesrv

  gateway:
    image: localhost:5000/gateway:latest # <--- 已修正
    container_name: gateway
    ports:
      - "7777:7777"
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - namesrv
      - mysql
      - redis

  practice:
    image: localhost:5000/practice:latest # <--- 已修正
    container_name: practice
    ports:
      - "2222:2222"
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - TZ=Asia/Shanghai
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql
      - redis
      - namesrv

  contest:
    image: localhost:5000/contest:latest # <--- 已修正
    container_name: contest
    ports:
      - "1234:1234"
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - TZ=Asia/Shanghai
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql
      - redis
      - namesrv

  run:
    image: localhost:5000/run:latest # <--- 已修正
    container_name: run
    ports:
      - "1001:1001"
    restart: on-failure
    privileged: true
    cgroup: host
    volumes:
      - ./user:/app/user
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - HOST_DIR=${HOST_DIR}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - namesrv

  advice:
    image: localhost:5000/advice:latest # <--- 已修正
    container_name: advice
    ports:
      - "9999:9999"
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - AI_API=${AI_API}
      - AI_URL=${AI_URL}
    depends_on:
      - mysql
      - namesrv

  nginx:
    image: localhost:5000/nginx:latest # <--- 已修正 (假设您也自定义构建了nginx)
    container_name: nginx
    ports:
      - "80:80"
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      - gateway

volumes:
  toolchain: