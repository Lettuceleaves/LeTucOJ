spring:
  datasource:
    url: jdbc:mysql://mysql:3306/letucoj?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: common
  data:
    redis:
      host: redis
      port: 6379
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB



snowflake:
  worker-id: 1
  datacenter-id: 1

